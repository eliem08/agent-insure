[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-insure"
version = "0.1.0"
description = "Geico for agents: insurance for when an agent makes an expensive mistake"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-insure = "agent_insure.__main__:main"

[tool.setuptools]
packages = ["agent_insure"]
